<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Restricted</title>
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 40px;
            max-width: 600px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            color: #f87171;
        }

        p {
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #e2e8f0;
        }

        .contact-info {
            margin-top: 20px;
        }

        .contact-info a {
            display: inline-block;
            text-decoration: none;
            color: #38bdf8;
            font-weight: bold;
            margin-top: 10px;
            transition: color 0.3s ease;
        }

        .contact-info a:hover {
            color: #0ea5e9;
        }

        .btn-home {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #2563eb;
            color: #ffffff;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .btn-home:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Access Restricted</h1>
        <p>We apologize for the inconvenience. Due to privacy concerns and potential bugs that could cause major issues, access to the old website is restricted.</p>
        <p>If you need access, please contact us directly to request permission.</p>
        <div class="contact-info">
            <p>Email: <a href="mailto:sushilraey@gmail.com">sushilraey@gmail.com</a></p>
            <p>Phone: <a href="tel:+9779814838396">+977-9814838396</a></p>
        </div>
        <button class="btn-home" onclick="window.location.href='index.html';">Go Back to Home</button>
    </div>
</body>
</html>
